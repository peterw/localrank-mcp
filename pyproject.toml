[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localrank"
version = "0.1.0"
description = "LocalRank — Google Maps rank tracking and citation building. MCP server + CLI for AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
localrank-mcp = "localrank_mcp:main"
localrank = "localrank_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["localrank_mcp"]
